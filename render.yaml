services:
  - type: web
    name: dragonmania
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_FILE
        value: /var/data/db.json
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
